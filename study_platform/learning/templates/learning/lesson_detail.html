
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ lesson.title }} — Класс знаний</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #171717;
            font-family: Arial, sans-serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 32px;
        }

        header {
            border-bottom: 1px solid #e5e5e5;
        }

        .header-inner {
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.7px;
        }

        .logo span {
            background: #d7ff38;
            padding: 3px 6px;
        }

        .back-link {
            font-size: 14px;
            color: #555555;
        }

        .back-link:hover {
            color: #171717;
        }

        main {
            padding: 64px 0 100px;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: #666666;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 800px;
            margin: 0 0 28px;
            font-size: clamp(34px, 5vw, 56px);
            line-height: 1.1;
            letter-spacing: -2px;
        }

        .accent-line {
            width: 64px;
            height: 6px;
            margin-bottom: 42px;
            background: #d7ff38;
        }

        .lesson-content {
            max-width: 760px;
            font-size: 17px;
            line-height: 1.85;
        }

        .lesson-content h2 {
            margin-top: 42px;
            margin-bottom: 16px;
            font-size: 27px;
            line-height: 1.25;
            letter-spacing: -0.6px;
        }

        .lesson-content h3 {
            margin-top: 32px;
            font-size: 21px;
        }

        .lesson-content p {
            margin: 0 0 22px;
        }

        .lesson-content ul,
        .lesson-content ol {
            margin-bottom: 26px;
            padding-left: 26px;
        }

        .lesson-content li {
            margin-bottom: 10px;
        }

        .lesson-content blockquote {
            margin: 30px 0;
            padding: 18px 24px;
            border-left: 4px solid #d7ff38;
            background: #f7f7f4;
        }

        .lesson-content img {
            max-width: 100%;
            height: auto;
        }

        footer {
            padding: 28px 0;
            border-top: 1px solid #e5e5e5;
            color: #777777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 20px;
            }

            .header-inner {
                min-height: 68px;
            }

            main {
                padding: 44px 0 70px;
            }

            h1 {
                letter-spacing: -1px;
            }

            .lesson-content {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container header-inner">
            <a class="logo" href="/">КЛАСС <span>ЗНАНИЙ</span></a>
            <a class="back-link" href="javascript:history.back()">← Назад</a>
        </div>
    </header>

    <main>
        <div class="container">
            <p class="eyebrow">УЧЕБНЫЙ МАТЕРИАЛ</p>

            <h1>{{ lesson.title }}</h1>

            <div class="accent-line"></div>

            <article class="lesson-content">
                {{ lesson.content|linebreaks }}
            </article>

            {% if progress and not progress.is_completed %}
            <form method="post" action="{% url 'complete_lesson' lesson.id %}" style="margin-top: 42px;">
                {% csrf_token %}
                <button type="submit" style="border: 0; background: #d7ff38; color: #171717; padding: 14px 22px; font: inherit; font-weight: 700; cursor: pointer;">
                    Отметить урок завершённым
                </button>
            </form>
            {% elif progress and progress.is_completed %}
            <p style="margin-top: 42px; font-weight: 700;">Урок завершён</p>
            {% endif %}
        </div>
    </main>

    <footer>
        <div class="container">
            Класс знаний · Платформа для подготовки к экзаменам
        </div>
    </footer>
</body>
</html>
